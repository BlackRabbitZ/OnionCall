name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tag und Paketversion vergleichen
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from onioncall import __version__

          package_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if package_version != __version__:
              raise SystemExit(
                  f"pyproject.toml ({package_version}) und onioncall.__version__ ({__version__}) stimmen nicht überein"
              )
          expected = "v" + package_version
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} stimmt nicht mit Paketversion {expected!r} überein")
          PY

      - name: Tests und Paketbau
        run: |
          ruff check .
          ruff format --check .
          python -m unittest discover -s tests -v
          python -m build

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "OnionCall $GITHUB_REF_NAME"
