name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U build
      - run: python -m build
      - name: Source archive
        run: git archive --format=zip --prefix=OnionCall-${GITHUB_REF_NAME}/ -o dist/OnionCall-${GITHUB_REF_NAME}.zip ${GITHUB_REF_NAME}
      - name: SHA-256 manifest
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
