name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.14"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Entwicklungsabhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Statische Prüfung
        run: |
          ruff check .
          ruff format --check .

      - name: Bytecode kompilieren
        run: python -m compileall -q onioncall tests

      - name: Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Paket bauen
        run: python -m build

      - name: Build-Artefakte speichern
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onioncall-packages
          path: dist/*
          if-no-files-found: error

  success:
    name: CI erfolgreich
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Matrix-Ergebnis prüfen
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"
