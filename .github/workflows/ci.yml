name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NO_COLOR: "1"

jobs:
  lint:
    name: lint (Ruff 0.16.8)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Ruff installieren
        run: python -m pip install "ruff==0.16.8"

      - name: Ruff prüfen
        run: python -m ruff check onioncall scripts tests

      - name: Python-3.10-Syntax prüfen
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for root in (Path("onioncall"), Path("scripts"), Path("tests")):
              for path in root.rglob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path), feature_version=(3, 10))
          print("Python-3.10-Syntax: OK")
          PY

  unit:
    name: unit tests (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Runtime-Abhängigkeiten installieren
        run: python -m pip install -r requirements.lock

      - name: Installierte Versionen anzeigen
        run: |
          python --version
          python -m pip --version
          python -c "import cryptography, prompt_toolkit, wcwidth; print('cryptography', cryptography.__version__); print('prompt_toolkit', prompt_toolkit.__version__); print('wcwidth', wcwidth.__version__)"

      - name: Python-Dateien kompilieren
        run: python -m compileall -q onioncall scripts tests

      - name: Unit- und Regressionstests
        run: python -m unittest discover -s tests -v

      - name: Paket bauen
        run: |
          python -m pip install "build==1.6.1"
          python -m build

      - name: Wheel in sauberer Umgebung prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .ci-wheel-venv
          .ci-wheel-venv/bin/python -m pip install dist/*.whl
          .ci-wheel-venv/bin/python -c "import onioncall; import onioncall.cli; import onioncall.webgui; print('Wheel import OK:', onioncall.__version__)"

  platform:
    name: platform (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.14"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Runtime-Abhängigkeiten installieren
        run: python -m pip install -r requirements.lock

      - name: Python- und Plattformdaten anzeigen
        run: |
          python --version
          python -c "import platform, sys; print(platform.platform()); print(sys.executable)"

      - name: Quellcode kompilieren
        run: python -m compileall -q onioncall scripts

      - name: Kernmodule importieren
        run: >-
          python -c "import onioncall; import onioncall.audio; import onioncall.cli;
          import onioncall.config; import onioncall.crypto; import onioncall.listener;
          import onioncall.protocol; import onioncall.tor; import onioncall.webgui;
          print('OnionCall platform smoke OK:', onioncall.__version__)"

      - name: CLI-Hilfe prüfen
        run: python -m onioncall.cli --help
