name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NO_COLOR: "1"

jobs:
  lint:
    name: lint (Ruff 0.16.8)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Ruff installieren
        run: python -m pip install "ruff==0.16.8"

      - name: Ruff prüfen
        run: python -m ruff check onioncall scripts tests

      - name: Python-3.10-Syntax prüfen
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for root in (Path("onioncall"), Path("scripts"), Path("tests")):
              for path in root.rglob("*.py"):
                  ast.parse(
                      path.read_text(encoding="utf-8"),
                      filename=str(path),
                      feature_version=(3, 10),
                  )
          print("Python-3.10-Syntax: OK")
          PY

  platform:
    name: platform (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.14"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Runtime-Abhängigkeiten installieren
        run: python -m pip install -r requirements.lock

      - name: Abhängigkeiten prüfen
        run: python -m pip check

      - name: Python- und Plattformdaten anzeigen
        run: |
          python --version
          python -c "import platform, sys; print(platform.platform()); print(sys.executable)"

      - name: Quellcode kompilieren
        run: python -m compileall -q onioncall scripts tests

      - name: Kernmodule importieren
        run: >-
          python -c "import onioncall; import onioncall.audio; import onioncall.cli;
          import onioncall.config; import onioncall.crypto; import onioncall.listener;
          import onioncall.protocol; import onioncall.tor; import onioncall.webgui;
          print('OnionCall platform smoke OK:', onioncall.__version__)"

      - name: CLI-Hilfe prüfen
        run: python -m onioncall.cli --help

      # Die komplette Testsuite läuft genau einmal auf dem neuesten unterstützten
      # Python unter Linux. Die übrigen fünf Matrix-Jobs prüfen Plattform- und
      # Interpreter-Kompatibilität, ohne dieselben Tests mehrfach auszuführen.
      - name: Unit-, Security- und Regressionstests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m unittest discover -s tests -v
