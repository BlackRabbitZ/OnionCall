[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onioncall"
version = "2.7.6"
description = "BRZ – OnionCall: sicherer Text und Push-to-talk über Tor mit zusätzlicher E2EE"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "BlackRabbitZ"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography==50.0.1", "prompt-toolkit==3.0.53", "wcwidth==0.8.4"]

[project.optional-dependencies]
dev = ["build==1.6.1", "ruff==0.16.8"]

[project.scripts]
onioncall = "onioncall.cli:main"

[project.urls]
Homepage = "https://github.com/BlackRabbitZ/OnionCall"
Repository = "https://github.com/BlackRabbitZ/OnionCall"
Issues = "https://github.com/BlackRabbitZ/OnionCall/issues"

[tool.setuptools.packages.find]
include = ["onioncall*"]

[tool.setuptools.package-data]
onioncall = ["assets/*.png"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"onioncall/webgui.py" = ["E501"]
